name: smart-evals
services:
  smart-eval:
    image: ${IMAGE_NAME:-smart-eval:latest}
    container_name: smart-eval
    restart: unless-stopped

    ports:
      - "5003:80"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp

    env_file:
      - .env

    environment:
      - TZ=Asia/Shanghai
      - DATABASE_PATH=/app/data/evaluation.db
      - DATASETS_DIR=/app/tmp/datasets
      - REPORTS_DIR=/app/tmp/evaluation/reports

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - smart-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smart-network:
    driver: "bridge"
